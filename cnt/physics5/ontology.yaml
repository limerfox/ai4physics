# Онтология проекта — шаблон. Скопируйте в корень проекта как ontology.yaml и замените <…>.
# Образец заполнения — demo_graph/ontology.yaml. Проверка: python3 check_week4.py

ontology: излучение полей в криволинейном пространстве-времени
goal: >
  Записывать ход исследования про излучение от различных полей в искривлённом
  пространстве-времени так, чтобы по графу можно было ответить: какие поля
  в каких фонах и каким методом исследованы, какие результаты получены, чем они
  проверены, какие задачи поставлены, чем они закрыты, на какие источники опирается отчёт.

# Компетентностные вопросы: 3–5. Каждый класс и каждое отношение нужны хотя бы одному.
# Пришлось вопросы дополнить до 6, поскольку много классов и отношений, не получилось уместить в 5
competency_questions:
  - Какие задачи поставлены, из каких подзадач они состоят, в каком они статусе и чем закрыты — расчётом, проверкой, отчётом или подзадачами?
  - Какие поля (скалярное, электромагнитное, гравитационное) в каких метриках исследованы и какие результаты для них получены?
  - Какие результаты проверены независимым методом (или на аналитическом пределе) и чем именно, и каким методом получен каждый результат, какие ограничения действуют?
  - На какие источники ссылается отчёт и какие расчёты/результаты он описывает, и на каких источниках основаны гипотезы и методы, использованные в расчётах?
  - Какие гипотезы проверяет каждый расчёт и каким результатом они подтверждены или опровергнуты?
  - В каком файле лежит код каждого расчёта и каждой проверки, а также сами результаты и тексты источников?

# Классы — множества объектов. Имя — существительное в единственном числе, без пробелов.
# parent — надкласс (null для верхних классов); definition — признак, по которому объект
# попадает в класс. Экземпляры (конкретная серия, конкретная статья) сюда не пишутся.
classes:
  ИнформационныйОбъект:
    parent: null
    definition: объект, который несёт сведения — задача, утверждение, данные, метод, текст
  Процесс:
    parent: null
    definition: то, что происходит во времени — расчёт, проверка
  Источник:
    parent: ИнформационныйОбъект
    definition: опубликованная работа, на которую ссылаются; текст — в library/
  Автор:
    parent: null
    definition: человек — автор опубликованной работы
  ЗапросКГрафу:
    parent: Процесс
    definition: обращение к внешнему графу знаний — источник, инструмент и аргументы, дата, число найденных записей
  Файл:
    parent: null
    definition: файл проекта — код, данные, статья; узел графа — сам файл
  ФизическаяСистема:
    parent: null
    definition: объект физической задачи — поле или фоновая геометрия
  Поле:
    parent: ФизическаяСистема
    definition: классическое поле, излучение которого рассматривается (скалярное, электромагнитное, гравитационное)
  ПространствоВремя:
    parent: ФизическаяСистема
    definition: фоновая метрика, на которой находится поле (Минковского, де Ситтера, Шварцшильда)
  Задача:
    parent: null
    definition: поручение пользователя или его часть; заметки задач в tasks/ ведёт агент
  Утверждение:
    parent: ИнформационныйОбъект
    definition: высказывание, которое может оказаться истинным или ложным
  Гипотеза:
    parent: Утверждение
    definition: утверждение о наличии и характере излучения, проверяемое расчётом
  Результат:
    parent: Утверждение
    definition: утверждение, полученное в расчёте, с выражением и условиями
  Метод:
    parent: ИнформационныйОбъект
    definition: способ расчёта (WKB, разложение по модам)
  Ограничение:
    parent: ИнформационныйОбъект
    definition: известное условие применимости метода
  Отчёт:
    parent: ИнформационныйОбъект
    definition: текст об исследовании для читателя; файл в reports/
  Расчёт:
    parent: Процесс
    definition: аналитический расчёт, проверяющий гипотезу
  Проверка:
    parent: Процесс
    definition: независимая проверка результата другим методом или в пределе

# Отношения: domain — класс источника связи, range — класс цели (можно список).
# characteristics — по желанию: [транзитивное], [функциональное], [симметричное].
properties:
  подзадачаОт:        {domain: Задача, range: Задача, characteristics: [транзитивное]}
  решает:             {domain: [Расчёт, Проверка], range: Задача}
  выполняет:          {domain: Отчёт, range: Задача}
  проверяет:          {domain: Расчёт, range: Гипотеза}
  рассматриваетПоле:  {domain: Расчёт, range: Поле}
  рассматриваетФон:   {domain: Расчёт, range: ПространствоВремя}
  применяет:          {domain: Расчёт, range: Метод}
  даёт:               {domain: Расчёт, range: Результат}
  подтверждает:       {domain: Результат, range: Гипотеза}
  опровергает:        {domain: Результат, range: Гипотеза}
  проверенЧерез:      {domain: Результат, range: Проверка}
  применимоК:         {domain: Результат, range: [Поле, ПространствоВремя]}
  ограничивает:       {domain: Ограничение, range: [Метод]}
  основанаНа:         {domain: [Гипотеза, Метод], range: Источник}
  описывает:          {domain: Отчёт, range: [Расчёт, Результат]}
  ссылаетсяНа:        {domain: Отчёт, range: Источник}
  хранитсяВ:          {domain: [Результат, Источник], range: Файл}
  реализованВ:        {domain: [Расчёт, Проверка], range: Файл}
  найденЗапросом:     {domain: Источник, range: ЗапросКГрафу}
  написан:            {domain: Источник, range: Автор}
  цитирует:           {domain: Источник, range: Источник}
  хранитсяВ:          {domain: Источник, range: Файл}

# Атрибуты — поле в начале заметки со значением из списка, например status: выполнена.
attributes:
  oa_status:
    domain: Источник
    values: [diamond, gold, hybrid, green, bronze, closed]
  status: {domain: Задача, values: [открыта, в работе, выполнена, заблокирована, принята]}

# Правила: не меньше двух. text — словами, dl — в дескрипционной логике.
# check — по желанию: как проверять правило на графе (закрытый мир). Виды:
#   some                 C ⊑ ∃R.D      — у каждого C есть связь R с D
#   some_inverse         C ⊑ ∃R⁻.D     — у каждого C есть входящая связь R от D
#   some_inverse_any     C ⊑ ∃R1⁻.⊤ ⊔ ∃R2⁻.⊤ — у каждого C есть входящая связь R1 или R2
#   all_inverse          C ⊑ ∀R⁻.D     — все, кто связан с C связью R, принадлежат D
#   defined              E ≡ C ⊓ ∃R.D  — скрипт выведет экземпляры класса E
#   defined_inverse      E ≡ C ⊓ (∃R1⁻.⊤ ⊔ ∃R2⁻.⊤) — скрипт выведет экземпляры E
#   defined_value        E ≡ C ⊓ ∃a.{v1, v2} — экземпляры C со значением атрибута a из списка
#   section              в заметке каждого C есть раздел «## <название>» (оформление)
#   disjoint_properties  связи R1 и R2 не соединяют одну и ту же пару
# В class, target и source можно указывать и определяемые классы (name из defined*).
rules:
  - id: П1
    text: Каждый расчёт проверяет хотя бы одну гипотезу.
    dl: "Расчёт ⊑ ∃проверяет.Гипотеза"
    check: {kind: some, class: Расчёт, property: проверяет, target: Гипотеза}
  - id: П2
    text: Каждый результат получен в каком-то расчёте.
    dl: "Результат ⊑ ∃даёт⁻.Расчёт"
    check: {kind: some_inverse, class: Результат, property: даёт, source: Расчёт}
  - id: П3
    text: Принятый результат — результат, прошедший хотя бы одну проверку.
    dl: "ПринятыйРезультат ≡ Результат ⊓ ∃проверенЧерез.Проверка"
    check: {kind: defined, name: ПринятыйРезультат, class: Результат, property: проверенЧерез, target: Проверка}
  - id: П4
    text: Каждый расчёт рассматривает хотя бы одно поле.
    dl: "Расчёт ⊑ ∃рассматриваетПоле.Поле"
    check: {kind: some, class: Расчёт, property: рассматриваетПоле, target: Поле}
  - id: П5
    text: Каждый расчёт ведётся на каком-то фоне.
    dl: "Расчёт ⊑ ∃рассматриваетФон.ПространствоВремя"
    check: {kind: some, class: Расчёт, property: рассматриваетФон, target: ПространствоВремя}
  - id: П6
    text: Результат не может одновременно подтверждать и опровергать одну гипотезу.
    dl: "DisjointObjectProperties(подтверждает опровергает)"
    check: {kind: disjoint_properties, properties: [подтверждает, опровергает]}
  - id: П7
    text: Выполненная задача — задача со статусом «выполнена» или «принята».
    dl: "ВыполненнаяЗадача ≡ Задача ⊓ ∃status.{выполнена, принята}"
    check: {kind: defined_value, name: ВыполненнаяЗадача, class: Задача, attribute: status, values: [выполнена, принята]}
  - id: П8
    text: Выполненную задачу закрывает расчёт, проверка или отчёт либо у неё есть подзадачи.
    dl: "ВыполненнаяЗадача ⊑ ∃решает⁻.⊤ ⊔ ∃выполняет⁻.⊤ ⊔ ∃подзадачаОт⁻.⊤"
    check: {kind: some_inverse_any, class: ВыполненнаяЗадача, properties: [решает, выполняет, подзадачаОт]}
  - id: П9
    text: Задача выполнена, только если выполнены все её подзадачи.
    dl: "ВыполненнаяЗадача ⊑ ∀подзадачаОт⁻.ВыполненнаяЗадача"
    check: {kind: all_inverse, class: ВыполненнаяЗадача, property: подзадачаОт, source: ВыполненнаяЗадача}
  - id: П10
    text: Каждый отчёт ссылается хотя бы на один источник.
    dl: "Отчёт ⊑ ∃ссылаетсяНа.Источник"
    check: {kind: some, class: Отчёт, property: ссылаетсяНа, target: Источник}
  - id: П11
    text: В заметке выполненной задачи есть раздел «Итог» — что сделано и чем проверено.
    dl: "— (правило оформления)"
    check: {kind: section, class: ВыполненнаяЗадача, section: Итог}
  - id: Л1
    text: Каждый источник указывает запрос к внешнему графу, которым он найден или сверен.
    dl: "Источник ⊑ ∃найденЗапросом.ЗапросКГрафу"
  - id: Л2
    text: У каждого источника записан хотя бы один автор.
    dl: "Источник ⊑ ∃написан.Автор"
